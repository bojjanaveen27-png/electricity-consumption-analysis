{% extends "base.html" %}
{% block title %}Change Password · Electricity Consumption Analysis{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Security & Access Settings</h1>
    <p class="muted">Update your administrative login password to safeguard your records.</p>
  </div>
</div>

<div class="panel form-panel" style="max-width: 580px; margin: 0 auto;">
  <h2>Update Account Password</h2>
  <form method="post" action="{{ url_for('change_password') }}" class="standard-form" style="flex-direction: column; align-items: stretch;">
    <div class="form-group">
      <label for="current_password">Current Password</label>
      <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required>
    </div>

    <div class="form-group">
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" placeholder="Minimum 6 characters" minlength="6" required>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" minlength="6" required>
    </div>

    <div class="form-action" style="margin-top: 10px; display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary">Update Password</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-neutral">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
